<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEOGO IPTV</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Times New Roman", Times, serif;
    color: #111;
    background: linear-gradient(160deg, #fff1df 0%, #ffbf7a 55%, #2b2b2b 130%);
    padding: 20px 16px 40px;
  }
  .conteneur { max-width: 640px; margin: 0 auto; }

  header {
    background: #111;
    color: #ffb15c;
    text-align: center;
    padding: 22px 16px;
    border-radius: 24px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
  }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: 3px; }
  header p { margin: 6px 0 0; font-size: 1rem; color: #ffd9b0; }

  .recherche {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    background: #fff;
    padding: 10px;
    border-radius: 28px;
    box-shadow: 0 12px 28px rgba(0,0,0,.22);
  }
  .recherche input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 1.1rem;
    padding: 10px 14px;
    border-radius: 20px;
    background: #fff3e4;
    min-width: 0;
  }
  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: bold;
    color: #ffb15c;
    background: #111;
    padding: 10px 20px;
    border-radius: 20px;
    box-shadow: 0 6px 14px rgba(0,0,0,.3);
    transition: transform .2s, box-shadow .2s;
  }
  button:hover { transform: translateY(-3px); box-shadow: 0 10px 18px rgba(0,0,0,.35); }
  button.secondaire { background: #fff; color: #111; }

  .boite {
    margin-top: 18px;
    background: #fff;
    border-radius: 22px;
    padding: 14px 18px;
    box-shadow: 0 10px 24px rgba(0,0,0,.2);
  }
  .boite summary { cursor: pointer; font-weight: bold; font-size: 1.1rem; }
  .boite label { display: block; margin: 14px 0 6px; font-size: .95rem; }
  .boite select, .boite input[type="text"], .boite input[type="url"], .boite input[type="password"], .boite input[type="file"] {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    padding: 10px 14px;
    border: none;
    border-radius: 16px;
    background: #fff3e4;
    margin-top: 8px;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .note { font-size: .85rem; opacity: .75; margin: 12px 0 0; }
  #statutImport { margin: 12px 0 0; font-weight: bold; }

  #message { text-align: center; margin: 22px 0 0; font-size: 1.05rem; }

  .carte {
    background: #fff;
    border-radius: 22px;
    padding: 16px 18px;
    margin-top: 16px;
    box-shadow: 0 10px 24px rgba(0,0,0,.2);
    transition: transform .25s, box-shadow .25s;
  }
  .carte:hover { transform: translateY(-5px); box-shadow: 0 16px 30px rgba(0,0,0,.28); }
  .carte h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .heure { margin: 0 0 10px; font-size: .95rem; color: #444; }
  .diffuseur {
    display: inline-block;
    background: #111;
    color: #ffb15c;
    padding: 6px 14px;
    border-radius: 16px;
    margin: 4px 6px 0 0;
    font-size: .95rem;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .liste-titre { margin: 12px 0 2px; font-size: .9rem; font-weight: bold; }
  .chaine-liste {
    display: inline-block;
    background: #fff0dd;
    border: 1px solid #111;
    padding: 4px 12px;
    border-radius: 14px;
    margin: 4px 6px 0 0;
    font-size: .9rem;
  }
  .carte details { margin-top: 12px; }
  .carte summary { cursor: pointer; font-size: .9rem; font-weight: bold; }
  .aucune { color: #8a2b2b; font-style: italic; font-size: .95rem; }
  .astuce { color: #555; font-style: italic; font-size: .9rem; margin-top: 8px; }

  .verifier {
    display: inline-block;
    margin-top: 16px;
    background: #ff8a1f;
    color: #111;
    font-weight: bold;
    text-decoration: none;
    padding: 9px 18px;
    border-radius: 18px;
    box-shadow: 0 6px 14px rgba(0,0,0,.28);
    transition: transform .2s, box-shadow .2s;
  }
  .verifier:hover { transform: translateY(-3px); box-shadow: 0 10px 18px rgba(0,0,0,.35); }

  footer { text-align: center; margin-top: 30px; font-size: .9rem; color: #111; opacity: .75; }
</style>
</head>
<body>
<div class="conteneur">

  <header>
    <h1>BEOGO IPTV</h1>
    <p>Trouve sur quelle chaîne passe ton match</p>
  </header>

  <form class="recherche" id="formulaire">
    <input type="text" id="champ" placeholder="Ex : Real Madrid, Arsenal..." autocomplete="off">
    <button type="submit">Chercher</button>
  </form>

  <details class="boite" id="boiteImport">
    <summary>Ma liste IPTV</summary>

    <label for="mode">Type de liste</label>
    <select id="mode">
      <option value="fichier">Fichier M3U (sur mon téléphone)</option>
      <option value="m3u_url">Lien M3U</option>
      <option value="xtream">Xtream Codes</option>
    </select>

    <div id="zone-fichier">
      <input type="file" id="fichier" accept=".m3u,.m3u8,.txt">
    </div>
    <div id="zone-m3u_url" hidden>
      <input type="url" id="lien" placeholder="http://exemple.com/liste.m3u" autocomplete="off">
    </div>
    <div id="zone-xtream" hidden>
      <input type="text" id="serveur" placeholder="Serveur : http://exemple.com:8080" autocomplete="off">
      <input type="text" id="utilisateur" placeholder="Nom d'utilisateur" autocomplete="off">
      <input type="password" id="motdepasse" placeholder="Mot de passe" autocomplete="off">
    </div>

    <div class="actions">
      <button type="button" id="btnImport">Importer</button>
      <button type="button" id="btnEffacer" class="secondaire">Effacer ma liste</button>
    </div>
    <p id="statutImport"></p>
    <p class="note">
      Tes identifiants ne sont jamais enregistrés. Seuls les noms des chaînes de sport
      sont gardés sur ton appareil. Le fichier M3U est lu directement sur ton téléphone.
    </p>
  </details>

  <p id="message"></p>
  <div id="resultats"></div>

  <footer>© Beogo Design</footer>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const NORM = (t) => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  let DIFFUSEURS = {};
  let chaines = [];
  let dernier = null;

  try { chaines = JSON.parse(localStorage.getItem("beogo_chaines") || "[]"); } catch (e) { chaines = []; }
  function sauver() {
    try { localStorage.setItem("beogo_chaines", JSON.stringify(chaines)); } catch (e) {}
  }

  const pret = fetch("/api/diffuseurs")
    .then((r) => r.json())
    .then((d) => { DIFFUSEURS = d.diffuseurs || {}; })
    .catch(() => {});

  function statut(texte) { $("statutImport").textContent = texte; }

  if (chaines.length) statut(chaines.length + " chaînes de sport enregistrées sur cet appareil.");

  // --- Choix du type d'import ---
  function afficherZone() {
    const mode = $("mode").value;
    ["fichier", "m3u_url", "xtream"].forEach((m) => { $("zone-" + m).hidden = (m !== mode); });
  }
  $("mode").addEventListener("change", afficherZone);

  // --- Lecture d'un fichier M3U (dans le navigateur) ---
  function parserM3U(texte) {
    const noms = [];
    for (const ligne of texte.split(/\r?\n/)) {
      if (ligne.startsWith("#EXTINF")) {
        const nom = ligne.slice(ligne.lastIndexOf(",") + 1).trim();
        if (nom) noms.push(nom);
      }
    }
    return noms;
  }
  function filtrer(noms) {
    const mots = Object.values(DIFFUSEURS).flat().map(NORM);
    const vus = new Set();
    const sortie = [];
    for (const n of noms) {
      const k = NORM(n);
      if (!vus.has(k) && mots.some((m) => k.includes(m))) {
        vus.add(k);
        sortie.push(n);
        if (sortie.length >= 600) break;
      }
    }
    return sortie;
  }

  // --- Import ---
  $("btnImport").addEventListener("click", async () => {
    const mode = $("mode").value;
    statut("Import en cours...");
    try {
      await pret;
      let noms;
      if (mode === "fichier") {
        const f = $("fichier").files[0];
        if (!f) { statut("Choisis d'abord un fichier."); return; }
        noms = filtrer(parserM3U(await f.text()));
      } else {
        const corps = mode === "m3u_url"
          ? { mode, url: $("lien").value.trim() }
          : { mode, serveur: $("serveur").value.trim(), utilisateur: $("utilisateur").value.trim(), mot_de_passe: $("motdepasse").value };
        const rep = await fetch("/api/iptv", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(corps),
        });
        const data = await rep.json();
        if (!rep.ok) { statut(data.erreur || "Import impossible."); return; }
        noms = data.chaines;
      }
      chaines = noms;
      sauver();
      $("motdepasse").value = "";
      $("lien").value = "";
      statut(noms.length
        ? noms.length + " chaînes de sport trouvées dans ta liste."
        : "Aucune chaîne Canal+, beIN, DAZN ou Ligue 1 trouvée dans cette liste.");
      if (dernier) afficher(dernier);
    } catch (e) {
      statut("Import impossible. Vérifie les informations.");
    }
  });

  $("btnEffacer").addEventListener("click", () => {
    chaines = [];
    sauver();
    statut("Ta liste a été effacée de cet appareil.");
    if (dernier) afficher(dernier);
  });

  // --- Chaînes de ta liste pour un match ---
  function paysDe(nom) {
    const m = nom.match(/^\s*([A-Za-z]{2})\s*[:|\-]/);
    if (m) return m[1].toUpperCase();
    if (/(^|[^a-z])fr([^a-z]|$)|france/i.test(nom)) return "FR";
    return "";
  }
  const ordre = (a, b) => a.localeCompare(b, undefined, { numeric: true });

  function chainesPour(regle) {
    const marque = new RegExp(regle.marque, "i");
    const fort = new RegExp(regle.fort, "i");
    const exclure = new RegExp(regle.exclure, "i");
    const principales = [];
    const possibles = [];
    for (const nom of chaines) {
      const k = NORM(nom);
      if (!marque.test(k) || exclure.test(k)) continue;
      const p = paysDe(nom);
      if (p && !regle.pays.includes(p)) continue;
      (fort.test(k) ? principales : possibles).push(nom);
    }
    const tri = (liste) =>
      liste.sort((a, b) => ((paysDe(b) !== "") - (paysDe(a) !== "")) || ordre(a, b));
    return {
      principales: tri(principales).slice(0, 30),
      possibles: tri(possibles).slice(0, 30),
    };
  }

  function etiquettes(conteneur, liste) {
    liste.forEach((nom) => {
      const p = document.createElement("span");
      p.className = "chaine-liste";
      p.textContent = nom;
      conteneur.appendChild(p);
    });
  }

  function remplirChaines(carte, m) {
    if (!m.regle) {
      const vide = document.createElement("span");
      vide.className = "aucune";
      vide.textContent = "Diffuseur non indiqué";
      carte.appendChild(vide);
      return;
    }

    const badge = document.createElement("span");
    badge.className = "diffuseur";
    badge.textContent = m.regle.diffuseur;
    carte.appendChild(badge);

    if (!chaines.length) {
      const a = document.createElement("div");
      a.className = "astuce";
      a.textContent = "Importe ta liste IPTV (menu au-dessus) pour voir les chaînes à ouvrir.";
      carte.appendChild(a);
      return;
    }

    const r = chainesPour(m.regle);

    if (r.principales.length) {
      const t = document.createElement("div");
      t.className = "liste-titre";
      t.textContent = "Chaînes les plus probables :";
      carte.appendChild(t);
      etiquettes(carte, r.principales);
    }

    if (r.possibles.length) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = "Autres chaînes possibles (" + r.possibles.length + ")";
      det.appendChild(sum);
      etiquettes(det, r.possibles);
      if (!r.principales.length) det.open = true;
      carte.appendChild(det);
    }

    if (!r.principales.length && !r.possibles.length) {
      const t = document.createElement("div");
      t.className = "aucune";
      t.textContent = "Aucune chaîne " + m.regle.diffuseur + " trouvée dans ta liste.";
      carte.appendChild(t);
    }
  }

  // --- Affichage des résultats ---
  function afficher(donnees) {
    const zone = $("resultats");
    zone.innerHTML = "";
    donnees.forEach((m) => {
      const carte = document.createElement("div");
      carte.className = "carte";

      const titre = document.createElement("h2");
      titre.textContent = m.match;
      carte.appendChild(titre);

      const heure = document.createElement("p");
      heure.className = "heure";
      heure.textContent = m.heure || "";
      carte.appendChild(heure);

      remplirChaines(carte, m);

      const sep = document.createElement("div");
      carte.appendChild(sep);
      const lien = document.createElement("a");
      lien.className = "verifier";
      lien.href = "https://www.google.com/search?q=" + encodeURIComponent(m.recherche || (m.match + " chaîne TV"));
      lien.target = "_blank";
      lien.rel = "noopener noreferrer";
      lien.textContent = "Vérifier sur Internet ↗";
      sep.appendChild(lien);

      zone.appendChild(carte);
    });
  }

  // --- Recherche ---
  $("formulaire").addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = $("champ").value.trim();
    $("resultats").innerHTML = "";
    $("message").textContent = "Recherche en cours...";
    try {
      await pret;
      const reponse = await fetch("/search?q=" + encodeURIComponent(q));
      const donnees = await reponse.json();
      if (!reponse.ok) {
        $("message").textContent = "Erreur : " + (donnees.erreur || "problème inconnu");
        return;
      }
      if (donnees.length === 0) {
        dernier = null;
        $("message").textContent = "Aucun match trouvé.";
        return;
      }
      dernier = donnees;
      $("message").textContent = donnees.length + " match(s) trouvé(s) :";
      afficher(donnees);
    } catch (err) {
      $("message").textContent = "Impossible de joindre le serveur.";
    }
  });
</script>
</body>
</html>
