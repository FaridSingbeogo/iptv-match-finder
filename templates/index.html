<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEOGO IPTV</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Times New Roman", Times, serif;
    color: #111;
    background: linear-gradient(160deg, #e6f7e3 0%, #b9e6b4 55%, #2b2b2b 130%);
    padding: 20px 16px 40px;
  }
  .conteneur { max-width: 640px; margin: 0 auto; }

  header {
    background: #111;
    color: #d9f5d4;
    text-align: center;
    padding: 22px 16px;
    border-radius: 24px;
    box-shadow: 0 14px 30px rgba(0,0,0,.35);
  }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: 3px; }
  header p { margin: 6px 0 0; font-size: 1rem; opacity: .85; }

  .recherche {
    margin-top: 22px;
    display: flex;
    gap: 10px;
    background: #fff;
    padding: 10px;
    border-radius: 28px;
    box-shadow: 0 12px 28px rgba(0,0,0,.22);
  }
  .recherche input {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 1.1rem;
    padding: 10px 14px;
    border-radius: 20px;
    background: #f1faef;
    min-width: 0;
  }
  .recherche button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: bold;
    color: #d9f5d4;
    background: #111;
    padding: 10px 20px;
    border-radius: 20px;
    box-shadow: 0 6px 14px rgba(0,0,0,.3);
    transition: transform .2s, box-shadow .2s;
  }
  .recherche button:hover { transform: translateY(-3px); box-shadow: 0 10px 18px rgba(0,0,0,.35); }

  #message { text-align: center; margin: 22px 0 0; font-size: 1.05rem; }

  .carte {
    background: #fff;
    border-radius: 22px;
    padding: 16px 18px;
    margin-top: 16px;
    box-shadow: 0 10px 24px rgba(0,0,0,.2);
    transition: transform .25s, box-shadow .25s;
  }
  .carte:hover { transform: translateY(-5px); box-shadow: 0 16px 30px rgba(0,0,0,.28); }
  .carte h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .heure { margin: 0 0 10px; font-size: .95rem; color: #444; }
  .chaine {
    display: inline-block;
    background: #111;
    color: #d9f5d4;
    padding: 6px 14px;
    border-radius: 16px;
    margin: 4px 6px 0 0;
    font-size: .95rem;
    box-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .aucune { color: #8a2b2b; font-style: italic; }

  footer { text-align: center; margin-top: 30px; font-size: .9rem; color: #111; opacity: .75; }
</style>
</head>
<body>
<div class="conteneur">

  <header>
    <h1>BEOGO IPTV</h1>
    <p>Trouve sur quelle chaîne passe ton match</p>
  </header>

  <form class="recherche" id="formulaire">
    <input type="text" id="champ" placeholder="Ex : Real Madrid, Arsenal, Argentina..." autocomplete="off">
    <button type="submit">Chercher</button>
  </form>

  <p id="message"></p>
  <div id="resultats"></div>

  <footer>© Beogo Design</footer>
</div>

<script>
  const formulaire = document.getElementById("formulaire");
  const champ = document.getElementById("champ");
  const message = document.getElementById("message");
  const resultats = document.getElementById("resultats");

  formulaire.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = champ.value.trim();
    resultats.innerHTML = "";
    message.textContent = "Recherche en cours...";

    try {
      const reponse = await fetch("/search?q=" + encodeURIComponent(q));
      const donnees = await reponse.json();

      if (!reponse.ok) {
        message.textContent = "Erreur : " + (donnees.erreur || "problème inconnu");
        return;
      }
      if (donnees.length === 0) {
        message.textContent = "Aucun match trouvé aujourd'hui.";
        return;
      }

      message.textContent = donnees.length + " match(s) trouvé(s) :";
      donnees.forEach((m) => {
        const carte = document.createElement("div");
        carte.className = "carte";

        const titre = document.createElement("h2");
        titre.textContent = m.match;
        carte.appendChild(titre);

        const heure = document.createElement("p");
        heure.className = "heure";
        heure.textContent = m.heure ? "Coup d'envoi : " + m.heure + " (UTC)" : "";
        carte.appendChild(heure);

        if (m.chaines.length === 0) {
          const vide = document.createElement("span");
          vide.className = "aucune";
          vide.textContent = "Chaîne française non indiquée";
          carte.appendChild(vide);
        } else {
          m.chaines.forEach((c) => {
            const badge = document.createElement("span");
            badge.className = "chaine";
            badge.textContent = c;
            carte.appendChild(badge);
          });
        }
        resultats.appendChild(carte);
      });
    } catch (err) {
      message.textContent = "Impossible de joindre le serveur.";
    }
  });
</script>
</body>
</html>
